<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>悄悄话 — 锦枭 & 妤歆</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Noto+Serif+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://imgcache.qq.com/qcloud/tcbjs/2.0.0/tcb.js"></script>
<style>
:root {
  --cream: #fef9f4;
  --blush: #fdf2f7;
  --rose: #e91e63;
  --coral: #ff6b81;
  --gold: #c9a87c;
  --text: #3d2c2e;
  --text-light: #8d6e73;
  --white: #ffffff;
}
* { margin:0; padding:0; box-sizing:border-box; }
html { font-size: 16px; scroll-behavior: smooth; }
body {
  font-family: "Noto Serif SC", "STSong", "Songti SC", "SimSun", serif;
  background: linear-gradient(175deg, var(--cream) 0%, var(--blush) 40%, #fef5f7 100%);
  color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased;
  display: flex; align-items: center; justify-content: center; padding: 2rem;
}
body::before {
  content: ''; position: fixed; top:0;left:0;width:100%;height:100%;
  pointer-events: none; z-index: 9999; opacity: 0.03;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
}

.gate { text-align: center; max-width: 380px; width: 100%; }
.gate-icon { font-size: 3rem; margin-bottom: 1rem; animation: float 3s ease-in-out infinite; }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
.gate-title { font-family: "Cormorant Garamond", serif; font-size: 2rem; font-weight: 300; font-style: italic; color: var(--rose); letter-spacing: 0.06em; margin-bottom: 0.5rem; }
.gate-subtitle { font-size: 0.9rem; color: var(--text-light); letter-spacing: 0.06em; margin-bottom: 2rem; }
.gate-input-wrap { display: flex; gap: 0.6rem; justify-content: center; margin-bottom: 1rem; }
.gate-input { width: 60px; height: 60px; text-align: center; font-size: 1.5rem; font-family: "Cormorant Garamond", serif; border: 1.5px solid rgba(201,168,124,0.4); border-radius: 12px; background: rgba(255,255,255,0.6); color: var(--text); outline: none; transition: all 0.3s ease; -webkit-appearance: none; }
.gate-input:focus { border-color: var(--rose); box-shadow: 0 0 0 3px rgba(233,30,99,0.08); }
.gate-btn { display: inline-block; margin-top: 1rem; padding: 0.75rem 2.5rem; border: none; border-radius: 25px; background: linear-gradient(135deg, var(--rose), var(--coral)); color: #fff; font-family: "Noto Serif SC", serif; font-size: 0.95rem; letter-spacing: 0.08em; cursor: pointer; box-shadow: 0 4px 16px rgba(233,30,99,0.2); transition: all 0.3s ease; }
.gate-btn:hover { box-shadow: 0 6px 24px rgba(233,30,99,0.35); transform: translateY(-1px); }
.gate-error { color: var(--rose); font-size: 0.85rem; margin-top: 0.8rem; min-height: 1.5em; }
.gate-back { display: inline-block; margin-top: 1.5rem; color: var(--text-light); font-size: 0.85rem; text-decoration: none; letter-spacing: 0.06em; transition: color 0.3s ease; }
.gate-back:hover { color: var(--rose); }

.main { display: none; max-width: 600px; width: 100%; padding: 2rem 0; }
.main-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2.5rem; }
.main-title { font-family: "Cormorant Garamond", serif; font-size: 1.8rem; font-weight: 300; font-style: italic; color: var(--rose); letter-spacing: 0.06em; }
.main-actions { display: flex; gap: 0.8rem; }
.main-btn { background: none; border: 1px solid rgba(201,168,124,0.3); border-radius: 20px; padding: 0.4rem 1rem; font-family: "Noto Serif SC", serif; font-size: 0.8rem; color: var(--text-light); cursor: pointer; letter-spacing: 0.04em; transition: all 0.3s ease; }
.main-btn:hover { border-color: var(--rose); color: var(--rose); }
.main-status { font-size: 0.75rem; color: var(--text-light); letter-spacing: 0.04em; display: flex; align-items: center; gap: 0.3rem; }
.main-status-dot { width: 6px; height: 6px; border-radius: 50%; background: #4caf50; }
.main-status-dot.offline { background: #ccc; }

.write-area { background: rgba(255,255,255,0.55); backdrop-filter: blur(8px); border-radius: 16px; border: 1px solid rgba(201,168,124,0.2); padding: 1.5rem; margin-bottom: 2rem; box-shadow: 0 2px 16px rgba(0,0,0,0.04); }
.write-textarea { width: 100%; min-height: 120px; border: none; background: transparent; font-family: "Noto Serif SC", serif; font-size: 0.95rem; color: var(--text); line-height: 2; letter-spacing: 0.04em; resize: vertical; outline: none; }
.write-textarea::placeholder { color: rgba(141,110,115,0.4); }
.write-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid rgba(201,168,124,0.15); }
.write-hint { font-size: 0.75rem; color: var(--text-light); letter-spacing: 0.04em; }
.write-submit { border: none; border-radius: 20px; background: linear-gradient(135deg, var(--rose), var(--coral)); color: #fff; padding: 0.5rem 1.5rem; font-family: "Noto Serif SC", serif; font-size: 0.85rem; letter-spacing: 0.06em; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 2px 10px rgba(233,30,99,0.15); }
.write-submit:hover { box-shadow: 0 4px 16px rgba(233,30,99,0.3); }
.write-submit:disabled { opacity: 0.5; cursor: not-allowed; }

.messages-title { font-family: "Cormorant Garamond", serif; font-size: 1.3rem; font-weight: 300; font-style: italic; color: var(--text-light); letter-spacing: 0.06em; margin-bottom: 1.2rem; }
.messages-loading { text-align: center; color: var(--text-light); font-size: 0.85rem; padding: 2rem; letter-spacing: 0.04em; }
.messages-empty { text-align: center; color: var(--text-light); font-size: 0.9rem; padding: 2.5rem; letter-spacing: 0.06em; opacity: 0.6; }
.message-card { background: rgba(255,255,255,0.55); backdrop-filter: blur(8px); border-radius: 12px; border: 1px solid rgba(201,168,124,0.15); padding: 1.2rem 1.5rem; margin-bottom: 0.8rem; position: relative; box-shadow: 0 1px 8px rgba(0,0,0,0.03); animation: cardIn 0.4s cubic-bezier(0.22, 0.61, 0.36, 1) both; }
@keyframes cardIn { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
.message-card-text { font-size: 0.95rem; color: var(--text); line-height: 2; letter-spacing: 0.04em; white-space: pre-wrap; word-break: break-word; }
.message-card-time { display: block; margin-top: 0.8rem; font-size: 0.75rem; color: var(--text-light); letter-spacing: 0.04em; }
.message-card-del { position: absolute; top: 0.6rem; right: 0.8rem; background: none; border: none; color: rgba(141,110,115,0.3); font-size: 0.9rem; cursor: pointer; transition: color 0.3s ease; padding: 0.2rem; line-height: 1; }
.message-card-del:hover { color: var(--rose); }

@media (max-width: 480px) {
  body { padding: 1rem; }
  .gate-input { width: 50px; height: 50px; font-size: 1.3rem; }
  .main-title { font-size: 1.4rem; }
  .message-card { padding: 1rem 1.2rem; }
  .write-area { padding: 1rem; }
}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-icon">💌</div>
  <h1 class="gate-title">悄悄话</h1>
  <p class="gate-subtitle">输入属于我们的密码</p>
  <div class="gate-input-wrap">
    <input class="gate-input" id="gate-d1" type="password" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off">
    <input class="gate-input" id="gate-d2" type="password" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off">
    <input class="gate-input" id="gate-d3" type="password" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off">
    <input class="gate-input" id="gate-d4" type="password" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off">
  </div>
  <button class="gate-btn" id="gate-btn">打 开</button>
  <p class="gate-error" id="gate-error"></p>
  <a class="gate-back" href="index.html">← 回到主页</a>
</div>

<div class="main" id="main">
  <div class="main-header">
    <h1 class="main-title">💌 悄悄话</h1>
    <div class="main-actions">
      <span class="main-status"><span class="main-status-dot" id="status-dot"></span><span id="status-text">离线</span></span>
      <button class="main-btn" id="refresh-btn">刷新</button>
      <button class="main-btn" id="logout-btn">离开</button>
    </div>
  </div>

  <div class="write-area">
    <textarea class="write-textarea" id="write-input" placeholder="在这里写下你想对 ta 说的心里话…" maxlength="500"></textarea>
    <div class="write-footer">
      <span class="write-hint" id="write-hint">云端同步中，ta 可以看到 ❤</span>
      <button class="write-submit" id="write-submit">悄悄告诉 ta</button>
    </div>
  </div>

  <h2 class="messages-title">已写下的心里话</h2>
  <div id="messages-container"><p class="messages-loading">正在加载...</p></div>
</div>

<script>
(function() {
  const PASSWORD = '0101';
  const COLLECTION = 'whispers';

  // ── CloudBase 初始化 ──
  let db = null, dbReady = false;
  const statusDot = document.getElementById('status-dot');
  const statusText = document.getElementById('status-text');
  const writeHint = document.getElementById('write-hint');

  function setDBStatus(ready) {
    dbReady = ready;
    if (ready) {
      statusDot.classList.remove('offline');
      statusText.textContent = '已同步';
      writeHint.textContent = '云端同步中，ta 可以看到 ❤';
    } else {
      statusDot.classList.add('offline');
      statusText.textContent = '离线';
      writeHint.textContent = '离线模式，仅本设备可见 ⚠';
    }
  }

  try {
    const tcbApp = tcb.init({ env: 'xiao-d2gofr0nc8a242bb8' });
    db = tcbApp.database();
    tcbApp.auth({ persistence: 'local' }).anonymousAuthProvider().signIn()
      .then(() => { setDBStatus(true); loadMessages(); })
      .catch(err => { console.warn('CloudBase 连接失败:', err.message); setDBStatus(false); loadMessagesLocal(); });
  } catch(e) {
    console.warn('CloudBase 未加载');
    setDBStatus(false);
    loadMessagesLocal();
  }

  // ── 密码门 ──
  const gate = document.getElementById('gate');
  const main = document.getElementById('main');
  const inputs = [
    document.getElementById('gate-d1'), document.getElementById('gate-d2'),
    document.getElementById('gate-d3'), document.getElementById('gate-d4')
  ];
  const gateBtn = document.getElementById('gate-btn');
  const gateError = document.getElementById('gate-error');

  inputs.forEach((inp, i) => {
    inp.addEventListener('input', (e) => {
      const val = e.target.value.replace(/[^0-9]/g, '');
      e.target.value = val;
      if (val && i < 3) inputs[i+1].focus();
    });
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !inp.value && i > 0) inputs[i-1].focus();
      if (e.key === 'Enter') gateBtn.click();
    });
    inp.addEventListener('paste', (e) => {
      e.preventDefault();
      const pasted = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '').slice(0,4);
      pasted.split('').forEach((ch, j) => { if (inputs[j]) inputs[j].value = ch; });
      if (pasted.length === 4) gateBtn.click();
    });
  });

  function checkPassword() {
    const entered = inputs.map(i => i.value).join('');
    if (entered === PASSWORD) {
      gate.style.display = 'none';
      main.style.display = 'block';
      gateError.textContent = '';
    } else {
      gateError.textContent = '密码不对哦，再想想我们的纪念日～';
      inputs.forEach(i => { i.value = ''; i.style.borderColor = 'rgba(233,30,99,0.5)'; });
      inputs[0].focus();
      setTimeout(() => inputs.forEach(i => i.style.borderColor = ''), 1500);
    }
  }
  gateBtn.addEventListener('click', checkPassword);

  // ── CloudBase 数据库操作 ──
  function loadMessages() {
    if (!dbReady) { loadMessagesLocal(); return; }
    db.collection(COLLECTION).orderBy('time', 'desc').limit(50).get()
      .then(res => {
        const msgs = (res.data || []).map(d => ({
          id: d._id,
          text: d.text,
          time: d.time
        }));
        renderMessages(msgs);
      })
      .catch(err => {
        console.warn('加载失败，尝试本地:', err);
        loadMessagesLocal();
      });
  }

  function addMessageDB(text) {
    if (!dbReady) { addMessageLocal(text); return; }
    const doc = {
      text: text.trim(),
      time: new Date().toLocaleString('zh-CN', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' }),
      timestamp: Date.now()
    };
    db.collection(COLLECTION).add(doc)
      .then(() => { loadMessages(); })
      .catch(err => { console.warn('保存失败:', err); addMessageLocal(text); });
  }

  function deleteMessageDB(id) {
    if (!dbReady) { deleteMessageLocal(id); return; }
    db.collection(COLLECTION).doc(id).remove()
      .then(() => { loadMessages(); })
      .catch(err => { console.warn('删除失败:', err); deleteMessageLocal(id); });
  }

  // ── 本地存储兜底 ──
  const STORAGE_KEY = 'whisper_messages_local';

  function getMessagesLocal() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch(e) { return []; }
  }

  function saveMessagesLocal(msgs) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(msgs));
  }

  function loadMessagesLocal() {
    renderMessages(getMessagesLocal());
  }

  function addMessageLocal(text) {
    const msgs = getMessagesLocal();
    msgs.unshift({
      id: 'local_' + Date.now(),
      text: text.trim(),
      time: new Date().toLocaleString('zh-CN', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' })
    });
    saveMessagesLocal(msgs);
    renderMessages(msgs);
  }

  function deleteMessageLocal(id) {
    let msgs = getMessagesLocal();
    msgs = msgs.filter(m => m.id !== id);
    saveMessagesLocal(msgs);
    renderMessages(msgs);
  }

  // ── 渲染 ──
  const messagesContainer = document.getElementById('messages-container');

  function renderMessages(msgs) {
    if (!msgs || msgs.length === 0) {
      messagesContainer.innerHTML = '<p class="messages-empty">还没有心里话，写下第一条吧 💭</p>';
      return;
    }
    messagesContainer.innerHTML = msgs.map((m, i) => `
      <div class="message-card" style="animation-delay:${i*0.05}s">
        <p class="message-card-text">${escapeHTML(m.text)}</p>
        <span class="message-card-time">${m.time}</span>
        <button class="message-card-del" data-id="${m.id}" title="删除">✕</button>
      </div>
    `).join('');

    messagesContainer.querySelectorAll('.message-card-del').forEach(btn => {
      btn.addEventListener('click', () => {
        if (confirm('确定要删除这条心里话吗？')) {
          if (dbReady && !btn.dataset.id.startsWith('local_')) {
            deleteMessageDB(btn.dataset.id);
          } else {
            deleteMessageLocal(btn.dataset.id);
          }
        }
      });
    });
  }

  function escapeHTML(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ── 提交 ──
  const writeInput = document.getElementById('write-input');
  document.getElementById('write-submit').addEventListener('click', () => {
    const text = writeInput.value.trim();
    if (!text) return;
    if (text.length < 2) { alert('再多写一点吧～'); return; }
    const btn = document.getElementById('write-submit');
    btn.disabled = true;
    btn.textContent = '发送中...';
    if (dbReady) {
      addMessageDB(text);
    } else {
      addMessageLocal(text);
    }
    writeInput.value = '';
    writeInput.focus();
    setTimeout(() => { btn.disabled = false; btn.textContent = '悄悄告诉 ta'; }, 1000);
  });

  writeInput.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      document.getElementById('write-submit').click();
    }
  });

  // ── 刷新 ──
  document.getElementById('refresh-btn').addEventListener('click', () => {
    messagesContainer.innerHTML = '<p class="messages-loading">正在刷新...</p>';
    if (dbReady) loadMessages();
    else loadMessagesLocal();
  });

  // ── 退出 ──
  document.getElementById('logout-btn').addEventListener('click', () => {
    gate.style.display = 'block';
    main.style.display = 'none';
    inputs.forEach(i => i.value = '');
    gateError.textContent = '';
    inputs[0].focus();
  });

})();
</script>
</body>
</html>
